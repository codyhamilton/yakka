<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ranges and distributions chart gallery</title>
    <link rel="stylesheet" href="/css/charts.css">
    <script type="module" src="/gallery/ranges.js"></script>
  </head>
  <body>
    <main class="yk-foundations">
      <h1>Ranges element</h1>

      <section aria-labelledby="box-heading">
        <h2 id="box-heading">Box and whisker with p95 and baseline</h2>
        <div id="box-host" class="yk-chart-grid"></div>
      </section>

      <section aria-labelledby="histogram-heading">
        <h2 id="histogram-heading">Fixed-bin histogram</h2>
        <div id="histogram-host" class="yk-chart-grid"></div>
      </section>

      <section aria-labelledby="strip-heading">
        <h2 id="strip-heading">Strip plot with sampled marks</h2>
        <div id="strip-host" class="yk-chart-grid"></div>
      </section>

      <section aria-labelledby="dots-heading">
        <h2 id="dots-heading">Dot plot</h2>
        <div id="dots-host" class="yk-chart-grid"></div>
      </section>

      <section aria-labelledby="states-heading">
        <h2 id="states-heading">Empty and unsupported</h2>
        <div id="states-host" class="yk-chart-grid"></div>
      </section>

      <output id="event-log" aria-live="polite">No chart event yet</output>
    </main>
  </body>
</html>
