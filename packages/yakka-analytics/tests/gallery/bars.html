<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bars and categorical chart gallery</title>
    <link rel="stylesheet" href="/css/charts.css">
    <script type="module" src="/gallery/bars.js"></script>
  </head>
  <body>
    <main class="yk-foundations">
      <h1>Bars element</h1>

      <section aria-labelledby="ranked-heading">
        <h2 id="ranked-heading">Ranked with (other)</h2>
        <div id="ranked-host" class="yk-chart-grid"></div>
      </section>

      <section aria-labelledby="stacked-heading">
        <h2 id="stacked-heading">Stacked</h2>
        <div id="stacked-host" class="yk-chart-grid"></div>
      </section>

      <section aria-labelledby="percent-heading">
        <h2 id="percent-heading">100 percent</h2>
        <div id="percent-host" class="yk-chart-grid"></div>
      </section>

      <section aria-labelledby="lollipop-heading">
        <h2 id="lollipop-heading">Lollipop</h2>
        <div id="lollipop-host" class="yk-chart-grid"></div>
      </section>

      <section aria-labelledby="slope-heading">
        <h2 id="slope-heading">Slope</h2>
        <div id="slope-host" class="yk-chart-grid"></div>
      </section>

      <section aria-labelledby="states-heading">
        <h2 id="states-heading">Empty and unsupported</h2>
        <div id="states-host" class="yk-chart-grid"></div>
      </section>

      <output id="event-log" aria-live="polite">No chart event yet</output>
    </main>
  </body>
</html>
