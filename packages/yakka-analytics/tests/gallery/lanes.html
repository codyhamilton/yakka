<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Timeline and gantt lanes gallery</title>
    <link rel="stylesheet" href="/css/charts.css">
    <script type="module" src="/gallery/lanes.js"></script>
  </head>
  <body>
    <main class="yk-foundations">
      <h1>Lanes element</h1>

      <section aria-labelledby="timeline-heading">
        <h2 id="timeline-heading">Timeline markers</h2>
        <div id="timeline-host" class="yk-chart-grid"></div>
      </section>

      <section aria-labelledby="gantt-heading">
        <h2 id="gantt-heading">Gantt spans</h2>
        <div id="gantt-host" class="yk-chart-grid"></div>
      </section>

      <output id="event-log" aria-live="polite">No chart event yet</output>
    </main>
  </body>
</html>
