<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Treemap chart gallery</title>
    <link rel="stylesheet" href="/css/charts.css">
    <script type="module" src="/gallery/treemap.js"></script>
  </head>
  <body>
    <main class="yk-foundations">
      <h1>Treemap element</h1>

      <section aria-labelledby="treemap-heading">
        <h2 id="treemap-heading">Two lenses: repo then model</h2>
        <div id="treemap-host" class="yk-chart-grid"></div>
      </section>

      <section aria-labelledby="states-heading">
        <h2 id="states-heading">Empty and unsupported</h2>
        <div id="states-host" class="yk-chart-grid"></div>
      </section>

      <output id="event-log" aria-live="polite">No chart event yet</output>
    </main>
  </body>
</html>
