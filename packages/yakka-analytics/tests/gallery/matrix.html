<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Matrix heatmap and calendar gallery</title>
    <link rel="stylesheet" href="/css/charts.css">
    <script type="module" src="/gallery/matrix.js"></script>
  </head>
  <body>
    <main class="yk-foundations">
      <h1>Matrix element</h1>

      <section aria-labelledby="heatmap-heading">
        <h2 id="heatmap-heading">Heatmap</h2>
        <div id="heatmap-host" class="yk-chart-grid"></div>
      </section>

      <section aria-labelledby="calendar-heading">
        <h2 id="calendar-heading">Calendar</h2>
        <div id="calendar-host" class="yk-chart-grid"></div>
      </section>

      <section aria-labelledby="states-heading">
        <h2 id="states-heading">Empty and unsupported</h2>
        <div id="states-host" class="yk-chart-grid"></div>
      </section>

      <output id="event-log" aria-live="polite">No chart event yet</output>
    </main>
  </body>
</html>
