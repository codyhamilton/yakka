<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Time-series chart gallery</title>
    <link rel="stylesheet" href="/css/charts.css">
    <script type="module" src="/gallery/time-series.js"></script>
  </head>
  <body>
    <main class="yk-foundations">
      <h1>Time-series element</h1>

      <section aria-labelledby="line-heading">
        <h2 id="line-heading">Line</h2>
        <div id="line-host" class="yk-chart-grid"></div>
      </section>

      <section aria-labelledby="area-heading">
        <h2 id="area-heading">Area</h2>
        <div id="area-host" class="yk-chart-grid"></div>
      </section>

      <section aria-labelledby="columns-heading">
        <h2 id="columns-heading">Stacked columns</h2>
        <div id="columns-host" class="yk-chart-grid"></div>
      </section>

      <section aria-labelledby="cumulative-heading">
        <h2 id="cumulative-heading">Cumulative</h2>
        <div id="cumulative-host" class="yk-chart-grid"></div>
      </section>

      <section aria-labelledby="share-heading">
        <h2 id="share-heading">Share</h2>
        <div id="share-host" class="yk-chart-grid"></div>
      </section>

      <section aria-labelledby="sync-heading">
        <h2 id="sync-heading">Two charts in one scale group</h2>
        <div id="sync-host" class="yk-chart-grid"></div>
      </section>

      <section aria-labelledby="thresholds-heading">
        <h2 id="thresholds-heading">Thresholds</h2>
        <div id="thresholds-host" class="yk-chart-grid"></div>
      </section>

      <section aria-labelledby="states-heading">
        <h2 id="states-heading">Empty and unsupported</h2>
        <div id="states-host" class="yk-chart-grid"></div>
      </section>

      <output id="event-log" aria-live="polite">No chart event yet</output>
    </main>
  </body>
</html>
